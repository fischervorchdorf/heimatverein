<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum meets KI - Vorchdorf</title>
    <style>
        :root { --gold: #d4af37; --bg: #1a1a1a; --text: #fdf5e6; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', serif; background-color: var(--bg); color: var(--text); text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; border: 1px solid var(--gold); padding: 25px; border-radius: 15px; background: #262626; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; font-size: 1.5em; margin-top: 0; }
        .btn { background: var(--gold); color: #1a1a1a; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 8px; text-transform: uppercase; font-size: 1em; }
        .btn:active { transform: scale(0.97); }
        .audio-player { width: 100%; margin: 20px 0; filter: invert(1); }
        .info-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin: 20px 0; text-align: left; border-left: 4px solid var(--gold); line-height: 1.6; }
        .game-area { border: 2px dashed var(--gold); padding: 20px; margin: 20px 0; border-radius: 10px; background: #111; }
        .error-msg { color: #ff6347; font-size: 0.8em; margin-top: 5px; display: none; }

        /* Schritt-Anzeige */
        .step-indicator { display: flex; justify-content: center; gap: 6px; margin-bottom: 15px; }
        .step-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(212,175,55,0.2); transition: all 0.3s; }
        .step-dot.done { background: var(--gold); }
        .step-dot.active { background: var(--gold); box-shadow: 0 0 8px rgba(212,175,55,0.6); transform: scale(1.3); }

        /* Röhren-SVG */
        .roehre-wrap { display: flex; justify-content: center; margin: 15px 0; }
        .roehre-wrap svg { width: 100px; height: 170px; }

        /* Voltage */
        #voltage-display { font-size: 2.5em; color: var(--gold); }

        /* Morse */
        .morse-btn {
            width: 130px; height: 130px; border-radius: 50%; border: 4px solid var(--gold);
            background: radial-gradient(circle, #3a2a00 0%, #1a1a1a 80%);
            color: var(--gold); font-size: 1em; font-weight: bold; cursor: pointer;
            margin: 15px auto; display: block; user-select: none; -webkit-user-select: none;
            transition: box-shadow 0.1s;
        }
        .morse-btn:active, .morse-btn.pressed {
            background: radial-gradient(circle, var(--gold) 0%, #3a2a00 80%);
            color: #1a1a1a; box-shadow: 0 0 40px rgba(212,175,55,0.6);
        }
        .morse-display {
            font-family: 'Courier New', monospace; font-size: 1.8em; letter-spacing: 6px;
            min-height: 45px; padding: 8px; color: var(--gold);
            border-bottom: 2px solid rgba(212,175,55,0.3); margin: 8px 0;
        }
        .morse-letter {
            font-family: 'Courier New', monospace; font-size: 1.2em;
            color: rgba(253,245,230,0.6); min-height: 28px; margin-bottom: 5px;
        }
        .morse-hint { font-size: 0.8em; color: rgba(253,245,230,0.4); margin-top: 12px; }
        .morse-target { font-size: 1.3em; font-weight: bold; color: var(--gold); letter-spacing: 4px; margin: 8px 0; }
        .morse-progress { display: flex; justify-content: center; gap: 8px; margin: 12px 0; }

        /* Morse-Alphabet Tabelle */
        .morse-alpha-toggle {
            background: none; border: 1px solid rgba(212,175,55,0.4); color: var(--gold);
            padding: 6px 14px; border-radius: 20px; font-size: 0.8em; cursor: pointer;
            margin: 10px 0; display: inline-block;
        }
        .morse-alpha-toggle:active { background: rgba(212,175,55,0.15); }
        .morse-alpha-table {
            display: none; grid-template-columns: repeat(4, 1fr); gap: 4px;
            margin: 10px 0; font-family: 'Courier New', monospace; font-size: 0.75em;
        }
        .morse-alpha-table.open { display: grid; }
        .morse-alpha-cell {
            background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.15);
            border-radius: 4px; padding: 4px 2px; text-align: center;
        }
        .morse-alpha-cell .char { color: var(--gold); font-weight: bold; font-size: 1.1em; }
        .morse-alpha-cell .code { color: rgba(253,245,230,0.6); font-size: 0.95em; }

        /* Freitext-Morse */
        .free-morse-area { margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(212,175,55,0.2); }
        .free-morse-output {
            font-family: 'Courier New', monospace; font-size: 1.4em; letter-spacing: 3px;
            color: var(--gold); min-height: 40px; padding: 8px;
            border-bottom: 2px solid rgba(212,175,55,0.3); margin: 8px 0; word-break: break-all;
        }
        .free-morse-dots {
            font-family: 'Courier New', monospace; font-size: 1.1em;
            color: rgba(253,245,230,0.5); min-height: 24px; margin-bottom: 8px;
        }
        .morse-progress span {
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid rgba(212,175,55,0.3); display: flex;
            align-items: center; justify-content: center; font-weight: bold; font-size: 0.9em;
        }
        .morse-progress .done { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.15); }
        .morse-progress .active { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 12px rgba(212,175,55,0.4); }
        .morse-progress .pending { color: rgba(253,245,230,0.3); }

        /* Frequenz-Drehknopf */
        .freq-dial-wrap { position: relative; width: 180px; height: 180px; margin: 15px auto; }
        .freq-dial {
            width: 180px; height: 180px; border-radius: 50%;
            border: 4px solid rgba(212,175,55,0.5);
            background: radial-gradient(circle, #2a2a2a 0%, #111 80%);
            position: relative; cursor: grab; user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        .freq-dial:active { cursor: grabbing; }
        .freq-needle {
            position: absolute; top: 10%; left: 50%; width: 3px; height: 40%;
            background: var(--gold); transform-origin: bottom center;
            border-radius: 2px; margin-left: -1.5px;
            box-shadow: 0 0 6px rgba(212,175,55,0.5);
        }
        .freq-display {
            font-family: 'Courier New', monospace; font-size: 2em; color: var(--gold);
            margin: 10px 0; letter-spacing: 2px;
        }
        .freq-bar-wrap {
            height: 40px; background: #0a0a0a; border-radius: 5px; margin: 10px 0;
            position: relative; overflow: hidden; border: 1px solid rgba(212,175,55,0.2);
        }
        .freq-bar-signal {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        }
        .freq-msg {
            font-family: 'Courier New', monospace; font-size: 1.1em;
            min-height: 60px; padding: 10px; color: lime;
            border: 1px solid rgba(0,255,0,0.2); border-radius: 5px;
            background: rgba(0,255,0,0.03); margin: 10px 0; text-align: left;
        }

        /* Fun Facts */
        .fun-facts {
            background: rgba(212,175,55,0.05); border: 1px solid rgba(212,175,55,0.2);
            border-radius: 10px; padding: 15px; margin: 15px 0; text-align: left;
        }
        .fun-facts h3 { color: var(--gold); margin-top: 0; font-size: 1em; }
        .fun-facts ul { margin: 0; padding-left: 20px; }
        .fun-facts li { margin: 8px 0; font-size: 0.9em; line-height: 1.5; }

        /* Erfolg-Seite */
        .erfolg-icon { font-size: 4em; margin: 10px 0; }
        .erfolg-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0;
        }
        .erfolg-stat {
            background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.2);
            border-radius: 8px; padding: 12px;
        }
        .erfolg-stat .label { font-size: 0.75em; color: rgba(253,245,230,0.5); text-transform: uppercase; }
        .erfolg-stat .value { font-size: 1.3em; color: var(--gold); font-weight: bold; margin-top: 4px; }

        .erfolg-animation { animation: erfolg-pulse 0.6s ease-in-out; }
        @keyframes erfolg-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease-out; }

        /* ===== STANDUHR STYLES ===== */
        /* Zahnrad-Puzzle */
        .gear-workspace { position: relative; width: 100%; height: 280px; background: #0a0808; border-radius: 8px; overflow: hidden; touch-action: none; }
        .gear-slot { position: absolute; border: 2px dashed rgba(212,175,55,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .gear-slot.filled { border-color: var(--gold); background: rgba(212,175,55,0.05); }
        .gear-slot .slot-label { font-size: 0.7em; color: rgba(212,175,55,0.4); pointer-events: none; }
        .gear-tray { display: flex; justify-content: center; gap: 15px; margin: 15px 0; padding: 10px; background: rgba(212,175,55,0.05); border-radius: 8px; }
        .gear-piece { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; transition: transform 0.15s; }
        .gear-piece:active { cursor: grabbing; transform: scale(1.1); }
        .gear-piece.placed { opacity: 0.3; pointer-events: none; }
        @keyframes gearSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes gearSpinReverse { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        /* Pendel */
        .pendel-canvas-wrap { display: flex; justify-content: center; margin: 10px 0; }
        .pendel-canvas-wrap canvas { border-radius: 8px; background: #0a0808; }
        .pendel-display { font-family: 'Courier New', monospace; font-size: 1.8em; color: var(--gold); margin: 5px 0; }
        .pendel-ticker { font-size: 1.2em; margin: 5px 0; }

        /* Zifferblatt bemalen */
        .face-canvas-wrap { display: flex; justify-content: center; margin: 10px 0; }
        .face-canvas-wrap canvas { border-radius: 50%; border: 3px solid rgba(212,175,55,0.4); cursor: crosshair; touch-action: none; }
        .color-picker { display: flex; justify-content: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        .color-swatch {
            width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent;
            cursor: pointer; transition: transform 0.15s, border-color 0.15s;
        }
        .color-swatch.active { border-color: white; transform: scale(1.2); }
        .stamp-picker { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
        .stamp-btn {
            padding: 6px 12px; border-radius: 15px; border: 1px solid rgba(212,175,55,0.3);
            background: rgba(212,175,55,0.08); color: var(--text); cursor: pointer; font-size: 1.2em;
        }
        .stamp-btn.active { border-color: var(--gold); background: rgba(212,175,55,0.2); }

        /* Zeitreise */
        .zeitreise-event {
            text-align: left; padding: 12px; margin: 8px 0; border-left: 3px solid var(--gold);
            background: rgba(212,175,55,0.04); border-radius: 0 8px 8px 0;
            opacity: 0; transform: translateX(-20px); transition: all 0.5s ease-out;
        }
        .zeitreise-event.visible { opacity: 1; transform: translateX(0); }
        .zeitreise-event .year { color: var(--gold); font-weight: bold; font-size: 1.1em; }
        .zeitreise-event .text { font-size: 0.9em; margin-top: 4px; line-height: 1.4; }

        /* Propaganda-Hotspots */
        .prop-hotspot {
            position: absolute; width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid rgba(255,100,100,0.6); background: rgba(255,100,100,0.15);
            color: rgba(255,100,100,0.8); font-weight: bold; font-size: 1.1em;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transform: translate(-50%,-50%);
            animation: hotspot-pulse 2s ease-in-out infinite;
        }
        @keyframes hotspot-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,100,100,0.3); }
            50% { box-shadow: 0 0 0 8px rgba(255,100,100,0); }
        }

        /* ===== FRONLEICHNAM STYLES ===== */
        .slider-wrap { position: relative; width: 100%; padding-bottom: 70%; overflow: hidden; border-radius: 8px; background: #111; }
        .slider-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.85em; color: rgba(253,245,230,0.3); }
        .slider-layer.alt { clip-path: inset(0 50% 0 0); transition: clip-path 0.05s; }
        .slider-handle { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--gold); left: 50%; z-index: 10; pointer-events: none; }
        .slider-handle::after { content: '⟨⟩'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--gold); color: #1a1a1a; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; }
        .slider-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; z-index: 11; margin: 0; }

        .person-hotspot {
            position: absolute; width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid rgba(212,175,55,0.5); background: rgba(212,175,55,0.1);
            color: var(--gold); font-size: 0.8em; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transform: translate(-50%,-50%);
            animation: hotspot-pulse 2s ease-in-out infinite;
        }
        .person-hotspot.found { background: rgba(212,175,55,0.6); color: #1a1a1a; border-color: var(--gold); animation: none; }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Lade Geschichte...</h1>
</div>

<script>
    // =============================================
    // ARÄOMETER
    // =============================================
    const ARAEOMETER_DEF = {
        titel: "Das Aräometer",
        schritte: [
            {
                typ: "info",
                titel: "Ein geheimnisvolles Glasinstrument",
                beschreibung: "Vor dir liegt ein filigranes Glasrohr mit einem Gewicht im Bauch und einer feinen Skala. Was misst man damit? Und warum war es für Apotheker und Zuckerfabrikanten so wertvoll?<br><br>Lass uns herausfinden, wie Dichte funktioniert – und dann damit arbeiten wie ein Chemiker um 1895!"
            },
            {
                typ: "schwimm-quiz",
                titel: "Schwimm oder Sink?",
                beschreibung: "Bevor wir das Aräometer benutzen, testen wir dein Bauchgefühl: Was schwimmt, was sinkt?"
            },
            {
                typ: "leopold-mission",
                titel: "Lehrling Leopold – Wien 1895",
                beschreibung: ""
            },
            {
                typ: "dichte-labor",
                titel: "Dichte-Labor",
                beschreibung: "Jetzt bist du der Experte! Tauche das Aräometer in unbekannte Flüssigkeiten und bestimme, was es ist."
            },
            {
                typ: "araeometer-erfolg",
                titel: "Präzision ist alles!",
                beschreibung: ""
            }
        ]
    };

    // --- Schwimm oder Sink Quiz ---
    const SCHWIMM_ITEMS = [
        { name: "Holzstück", emoji: "🪵", schwimmt: true, erklaerung: "Holz ist leichter als Wasser (Dichte ~0,5). Es schwimmt!" },
        { name: "Stein", emoji: "🪨", schwimmt: false, erklaerung: "Stein ist schwerer als Wasser (Dichte ~2,5). Er sinkt!" },
        { name: "rohes Ei", emoji: "🥚", schwimmt: false, erklaerung: "Ein rohes Ei ist knapp schwerer als Wasser – es sinkt. In Salzwasser würde es schwimmen!" },
        { name: "Korken", emoji: "🍾", schwimmt: true, erklaerung: "Kork hat eine sehr geringe Dichte (~0,2). Er schwimmt hoch oben!" },
        { name: "Eiswürfel", emoji: "🧊", schwimmt: true, erklaerung: "Eis ist leichter als flüssiges Wasser (Dichte 0,92). Deshalb schwimmen Eisberge!" },
        { name: "Münze", emoji: "🪙", schwimmt: false, erklaerung: "Metall ist viel dichter als Wasser. Die Münze sinkt sofort." }
    ];
    let schwimmIdx = 0, schwimmScore = 0;

    function buildSchwimmQuizUI() {
        schwimmIdx = 0; schwimmScore = 0;
        return `<div class="game-area" id="schwimmArea"><div id="schwimmContent"></div></div>`;
    }

    function renderSchwimmFrage() {
        if (schwimmIdx >= SCHWIMM_ITEMS.length) {
            document.getElementById('schwimmContent').innerHTML = `
                <div class="fade-in" style="text-align:center;">
                    <p style="color:lime; font-weight:bold; font-size:1.1em;">${schwimmScore}/${SCHWIMM_ITEMS.length} richtig!</p>
                    <div class="info-box" style="font-size:0.9em;"><strong>Das Prinzip:</strong> Ob etwas schwimmt oder sinkt, hängt von der <strong>Dichte</strong> ab. Ist ein Gegenstand leichter als die Flüssigkeit → er schwimmt. Schwerer → er sinkt. Und genau das nutzt das Aräometer: Es sinkt unterschiedlich tief ein, je nach Dichte der Flüssigkeit!</div>
                </div>`;
            setTimeout(() => {
                if (!document.getElementById('schwimmWeiter')) {
                    const btn = document.createElement('button');
                    btn.id = 'schwimmWeiter'; btn.className = 'btn erfolg-animation';
                    btn.innerText = 'Weiter – Lehrling Leopold';
                    btn.onclick = () => next();
                    document.getElementById('app').appendChild(btn);
                }
            }, 500);
            return;
        }
        const item = SCHWIMM_ITEMS[schwimmIdx];
        let dots = '<div class="step-indicator" style="margin-bottom:10px;">';
        for (let i = 0; i < SCHWIMM_ITEMS.length; i++) dots += `<div class="step-dot ${i < schwimmIdx ? 'done' : i === schwimmIdx ? 'active' : ''}"></div>`;
        dots += '</div>';

        document.getElementById('schwimmContent').innerHTML = `
            <div class="fade-in" style="text-align:center;">
                ${dots}
                <div style="font-size:3em; margin:10px 0;">${item.emoji}</div>
                <p style="font-size:1.2em; color:var(--gold); font-weight:bold;">${item.name}</p>
                <p style="font-size:0.9em;">Schwimmt es oder sinkt es in Wasser?</p>
                <div style="display:flex; gap:10px; margin:10px 0;">
                    <button class="btn" style="width:50%; margin:0; background:#2980b9;" onclick="checkSchwimm(true)">🌊 Schwimmt</button>
                    <button class="btn" style="width:50%; margin:0; background:#c0392b;" onclick="checkSchwimm(false)">⬇️ Sinkt</button>
                </div>
                <div id="schwimmFb" style="min-height:50px;"></div>
            </div>`;
    }

    function checkSchwimm(antwort) {
        const item = SCHWIMM_ITEMS[schwimmIdx];
        const correct = antwort === item.schwimmt;
        if (correct) { schwimmScore++; playTone(523, 200); } else { playTone(200, 200); }
        document.getElementById('schwimmFb').innerHTML = `<div class="info-box fade-in" style="font-size:0.85em; border-left-color:${correct ? 'lime' : '#ff6347'};"><strong>${correct ? '✓ Richtig!' : '✗ Falsch!'}</strong> ${item.erklaerung}</div>`;
        setTimeout(() => { schwimmIdx++; renderSchwimmFrage(); }, 2000);
    }

    // --- Leopold Mission ---
    const LEOPOLD_PROBEN = [
        { name: "Himbeersirip", zielBaume: 56, toleranz: 3, beschreibung: "Für die kaiserlichen Himbeerbonbons. Herr Gruber schaut dir über die Schulter!", ergebnis_gut: "Perfekt! 56 Baumé – die Bonbons werden köstlich.", ergebnis_schlecht: "Zu weit daneben! Der Sirup wäre zu dünn oder zu dick für die Bonbons." },
        { name: "Zitronensirup", zielBaume: 48, toleranz: 3, beschreibung: "Für die beliebten Zitronendrops. Die Dichte muss stimmen!", ergebnis_gut: "Ausgezeichnet! Die Zitronendrops werden perfekt.", ergebnis_schlecht: "Nicht genau genug. Leopold, Präzision ist der Schlüssel!" },
        { name: "Karamellsirup", zielBaume: 62, toleranz: 3, beschreibung: "Der dickste Sirup – für Karamellpralinen. Vorsicht, sehr zäh!", ergebnis_gut: "Hervorragend! Herr Gruber nickt zufrieden.", ergebnis_schlecht: "Knapp daneben. Bei Karamell muss es exakt stimmen!" }
    ];
    let leopoldIdx = 0, leopoldScore = 0;

    function buildLeopoldUI() {
        leopoldIdx = 0; leopoldScore = 0;
        return `
        <div class="game-area" id="leopoldArea">
            <div class="info-box" style="font-size:0.9em;">
                <strong>Wien, 1895 – Grubers Zuckerwarenfabrik</strong><br>
                Du bist Leopold, 17, Chemikerlehrling. Dein Meister Dr. Steiner hat dir eingeschärft: <em>„Präzision, Leopold! Präzision ist der Schlüssel zur Meisterschaft!"</em><br><br>
                Heute musst du drei Sirupe prüfen. Stelle das Aräometer auf den richtigen Baumé-Wert ein.
            </div>
            <div id="leopoldContent"></div>
        </div>`;
    }

    function renderLeopoldProbe() {
        if (leopoldIdx >= LEOPOLD_PROBEN.length) {
            document.getElementById('leopoldContent').innerHTML = `
                <div class="fade-in" style="text-align:center;">
                    <p style="color:var(--gold); font-weight:bold; font-size:1.1em;">Alle Proben getestet!</p>
                    <p>${leopoldScore}/${LEOPOLD_PROBEN.length} Sirupe korrekt gemessen.</p>
                    <p style="font-size:0.9em;">${leopoldScore === 3 ? 'Herr Gruber strahlt: „Leopold, Sie sind ein wahrer Chemiker!"' : leopoldScore >= 2 ? '„Gut gemacht, Leopold. Übung macht den Meister."' : '„Leopold, morgen nochmal. Und diesmal: Präzision!"'}</p>
                </div>`;
            setTimeout(() => {
                if (!document.getElementById('leopoldWeiter')) {
                    const btn = document.createElement('button');
                    btn.id = 'leopoldWeiter'; btn.className = 'btn erfolg-animation';
                    btn.innerText = 'Weiter – Dichte-Labor';
                    btn.onclick = () => next();
                    document.getElementById('app').appendChild(btn);
                }
            }, 500);
            return;
        }
        const probe = LEOPOLD_PROBEN[leopoldIdx];
        document.getElementById('leopoldContent').innerHTML = `
            <div class="fade-in" style="text-align:center;">
                <div class="step-indicator" style="margin:10px 0;">
                    ${LEOPOLD_PROBEN.map((_, i) => `<div class="step-dot ${i < leopoldIdx ? 'done' : i === leopoldIdx ? 'active' : ''}"></div>`).join('')}
                </div>
                <p style="color:var(--gold); font-weight:bold; font-size:1.1em;">Probe ${leopoldIdx+1}: ${probe.name}</p>

                <div style="position:absolute; top:10%; left:50%; width:4px; height:40%; background:var(--gold); transform-origin:bottom center; border-radius:2px; margin-left:-2px;" id="kurbelNadel"></div>
            </div>

            <p style="font-size:0.85em; color:rgba(253,245,230,0.4);">Drehe den Knopf im Kreis – wie eine echte Magnetkurbel!</p>
            <div id="kurbelStatus" style="margin-top:10px; font-size:1em;"></div>
        </div>`;

    function initVerbindung() {
        const dial = document.getElementById('kurbelDial');
        if (!dial) return;
        let lastAngle = 0, totalRotation = 0, dragging = false;

        function getAngle(e) {
            const rect = dial.getBoundingClientRect();
            const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - cy, clientX - cx);
        }
        function onStart(e) { e.preventDefault(); dragging = true; lastAngle = getAngle(e); }
        function onMove(e) {
            if (!dragging) return;
            e.preventDefault();
            const angle = getAngle(e);
            let delta = angle - lastAngle;
            if (delta > Math.PI) delta -= 2*Math.PI;
            if (delta < -Math.PI) delta += 2*Math.PI;
            lastAngle = angle;
            totalRotation += delta;
            document.getElementById('kurbelNadel').style.transform = 'rotate(' + (totalRotation * 180/Math.PI) + 'deg)';

            const newCount = Math.floor(Math.abs(totalRotation) / (Math.PI * 2));
            if (newCount > kurbelCount) {
                kurbelCount = newCount;
                playTone(600 + kurbelCount * 50, 80);
                document.getElementById('kurbelCount').innerText = 'Kurbeldrehungen: ' + Math.min(kurbelCount, kurbelTarget) + ' / ' + kurbelTarget;
                if (kurbelCount >= kurbelTarget) {
                    const st = document.getElementById('kurbelStatus');
                    st.innerHTML = '<strong style="color:lime;">KLINGELING! Verbindung steht!</strong>';
                    playTone(800, 500);
                    setTimeout(() => {
                        if (!document.getElementById('verbWeiter')) {
                            const btn = document.createElement('button');
                            btn.id = 'verbWeiter'; btn.className = 'btn erfolg-animation';
                            btn.innerText = 'Weiter – Meldung durchgeben';
                            btn.onclick = () => next();
                            document.getElementById('app').appendChild(btn);
                        }
                    }, 600);
                }
            }
        }
        function onEnd() { dragging = false; }
        dial.addEventListener('mousedown', onStart);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        dial.addEventListener('touchstart', onStart, {passive:false});
        document.addEventListener('touchmove', onMove, {passive:false});
        document.addEventListener('touchend', onEnd);
    }

    let audioCtx = null;
    function getAudioCtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, durationMs) {
        try {
            const ctx = getAudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = freq || 680;
            osc.type = 'sine';
            gain.gain.value = 0.25;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + (durationMs || 200) / 1000);
        } catch(e) {}
    }

    // Rauschen für Frequenz-Suche
    let noiseNode = null, noiseGain = null;
    function startNoise() {
        try {
            const ctx = getAudioCtx();
            const bufSize = ctx.sampleRate * 2;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
            noiseNode = ctx.createBufferSource();
            noiseNode.buffer = buf;
            noiseNode.loop = true;
            noiseGain = ctx.createGain();
            noiseGain.gain.value = 0.08;
            noiseNode.connect(noiseGain);
            noiseGain.connect(ctx.destination);
            noiseNode.start();
        } catch(e) {}
    }
    function setNoiseLevel(level) {
        if (noiseGain) noiseGain.gain.value = level;
    }
    function stopNoise() {
        try { if (noiseNode) { noiseNode.stop(); noiseNode = null; noiseGain = null; } } catch(e) {}
    }

    // Morse-Piep-Ton für Antwort
    function playMorseString(morseStr, cb) {
        const ctx = getAudioCtx();
        let time = ctx.currentTime + 0.3;
        const dot = 0.08, dash = 0.24, gap = 0.1, letterGap = 0.3;
        for (const ch of morseStr) {
            if (ch === '.') {
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.frequency.value = 750; o.type = 'sine'; g.gain.value = 0.2;
                o.connect(g); g.connect(ctx.destination);
                o.start(time); o.stop(time + dot); time += dot + gap;
            } else if (ch === '-') {
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.frequency.value = 750; o.type = 'sine'; g.gain.value = 0.2;
                o.connect(g); g.connect(ctx.destination);
                o.start(time); o.stop(time + dash); time += dash + gap;
            } else if (ch === ' ') {
                time += letterGap;
            }
        }
        if (cb) setTimeout(cb, (time - ctx.currentTime) * 1000 + 200);
    }

            const a1 = (i/teeth) * Math.PI * 2;
            const a2 = ((i+0.3)/teeth) * Math.PI * 2;
            const a3 = ((i+0.5)/teeth) * Math.PI * 2;
            const a4 = ((i+0.8)/teeth) * Math.PI * 2;
            path += `${i===0?'M':'L'}${r+Math.cos(a1)*ir},${r+Math.sin(a1)*ir} `;
            path += `L${r+Math.cos(a2)*tr},${r+Math.sin(a2)*tr} `;
            path += `L${r+Math.cos(a3)*tr},${r+Math.sin(a3)*tr} `;
            path += `L${r+Math.cos(a4)*ir},${r+Math.sin(a4)*ir} `;
        }
        path += 'Z';
        return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><path d="${path}" fill="${color}" stroke="rgba(212,175,55,0.6)" stroke-width="1"/><circle cx="${r}" cy="${r}" r="${r*0.2}" fill="#333" stroke="rgba(212,175,55,0.4)" stroke-width="1"/></svg>`;
    }

    function initZahnrad() {
        gearsPlaced = 0;
        const pieces = document.querySelectorAll('.gear-piece');
        pieces.forEach(piece => {
            let startX, startY, origLeft, origTop;
            const onStart = (e) => {
                e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                const rect = piece.getBoundingClientRect();
                startX = touch.clientX - rect.left;
                startY = touch.clientY - rect.top;
                piece.style.position = 'fixed';
                piece.style.zIndex = '100';
                piece.style.left = (touch.clientX - startX) + 'px';
                piece.style.top = (touch.clientY - startY) + 'px';
                origLeft = rect.left; origTop = rect.top;
            };
            const onMove = (e) => {
                if (!piece.style.position || piece.style.position !== 'fixed') return;
                e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                piece.style.left = (touch.clientX - startX) + 'px';
                piece.style.top = (touch.clientY - startY) + 'px';
            };
            const onEnd = (e) => {
                if (piece.style.position !== 'fixed') return;
                const rect = piece.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                const size = piece.dataset.size;
                let matched = false;
                document.querySelectorAll('.gear-slot').forEach(slot => {
                    if (slot.dataset.size === size && !slot.classList.contains('filled')) {
                        const sr = slot.getBoundingClientRect();
                        const sx = sr.left + sr.width/2, sy = sr.top + sr.height/2;
                        if (Math.abs(cx-sx) < 50 && Math.abs(cy-sy) < 50) {
                            slot.classList.add('filled');
                            slot.innerHTML = piece.innerHTML;
                            const svg = slot.querySelector('svg');
                            if (svg) {
                                const dir = gearsPlaced % 2 === 0 ? 'gearSpin' : 'gearSpinReverse';
                                svg.style.animation = dir + ' 3s linear infinite';
                            }
                            piece.classList.add('placed');
                            piece.style.position = '';
                            piece.style.zIndex = '';
                            gearsPlaced++;
                            playTone(300 + gearsPlaced * 100, 200);
                            const fb = document.getElementById('gearFeedback');
                            if (gearsPlaced === 3) {
                                if (fb) { fb.innerHTML = '<strong style="color:lime;">Alle Zahnräder sitzen! Das Uhrwerk dreht sich!</strong>'; }
                                setTimeout(() => {
                                    const app = document.getElementById('app');
                                    const btn = document.createElement('button');
                                    btn.className = 'btn erfolg-animation';
                                    btn.innerText = 'Weiter – Pendel einstellen';
                                    btn.onclick = () => next();
                                    app.appendChild(btn);
                                }, 800);
                            } else {
                                if (fb) fb.innerText = gearsPlaced + '/3 Zahnräder eingesetzt';
                            }
                            matched = true;
                        }
                    }
                });
                if (!matched) {
                    piece.style.position = '';
                    piece.style.zIndex = '';
                    const fb = document.getElementById('gearFeedback');
                    if (fb && !piece.classList.contains('placed')) { fb.innerText = 'Passt nicht – probiere eine andere Stelle!'; fb.style.color = '#ff6347'; setTimeout(() => { if(fb) fb.style.color = ''; }, 1000); }
                }
            };
            piece.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            piece.addEventListener('touchstart', onStart, {passive:false});
            document.addEventListener('touchmove', onMove, {passive:false});
            document.addEventListener('touchend', onEnd);
        });
    }

    // --- Pendel-Justierung ---
    let pendelInterval = null, pendelOk = false;
    function buildPendelUI() {
        return `
        <div class="game-area">
            <div class="pendel-canvas-wrap"><canvas id="pendelCanvas" width="280" height="250"></canvas></div>
            <div class="pendel-display" id="pendelDisplay">Pendellänge: 50 cm</div>

            <input type="range" min="20" max="120" value="50" style="width:90%;" id="pendelSlider">
            <p style="font-size:0.8em; color:rgba(253,245,230,0.4);">Ziel: 1 Tick pro Sekunde (100 cm = 1 Sekunde)</p>
            <p id="pendelFeedback" style="font-size:1em; min-height:24px;"></p>
        </div>`;
    }

    function initPendel() {
        pendelOk = false;
        const canvas = document.getElementById('pendelCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('pendelSlider');
        let length = 50, angle = Math.PI/6, velocity = 0;
        const g = 9.81;

        function draw() {
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            const pivotX = w/2, pivotY = 30;
            const scale = length / 100 * 150;
            const bobX = pivotX + Math.sin(angle) * scale;
            const bobY = pivotY + Math.cos(angle) * scale;

            // Aufhängung
            ctx.fillStyle = 'rgba(212,175,55,0.6)';
            ctx.fillRect(pivotX - 15, pivotY - 5, 30, 10);

            // Stange
            ctx.strokeStyle = 'rgba(212,175,55,0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(bobX, bobY); ctx.stroke();

            // Gewicht
            ctx.beginPath(); ctx.arc(bobX, bobY, 14, 0, Math.PI*2);
            ctx.fillStyle = '#8B6914'; ctx.fill();
            ctx.strokeStyle = 'rgba(212,175,55,0.7)'; ctx.lineWidth = 2; ctx.stroke();

            // Tick-Markierung
            ctx.strokeStyle = 'rgba(212,175,55,0.15)';
            ctx.setLineDash([3,3]);
            ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(pivotX, pivotY + scale + 20); ctx.stroke();
            ctx.setLineDash([]);
        }

        let lastTick = 0, tickCount = 0, tickTimes = [], lastAngleSign = 1, lastFrame = Date.now();
        function simulate() {
            const now = Date.now();
            const realDt = Math.min((now - lastFrame) / 1000, 0.05); // cap at 50ms
            lastFrame = now;
            // Sub-step physics for stability
            const steps = Math.max(1, Math.round(realDt / 0.004));
            const dt = realDt / steps;
            for (let s = 0; s < steps; s++) {
                const acc = -(g / (length/100)) * Math.sin(angle);
                velocity += acc * dt;
                velocity *= 0.999;
                angle += velocity * dt;
            } // end sub-steps

            // Tick-Erkennung (jeder Durchgang durch Mitte = Halbperiode)
            const currentSign = angle >= 0 ? 1 : -1;
            if (currentSign !== lastAngleSign) {
                lastAngleSign = currentSign;
                const now = Date.now();
                if (lastTick > 0) {
                    const interval = (now - lastTick) / 1000;
                    tickTimes.push(interval);
                    if (tickTimes.length > 3) tickTimes.shift();
                    const avg = tickTimes.reduce((a,b) => a+b, 0) / tickTimes.length;
                    const ticker = document.getElementById('pendelTicker');
                    if (ticker) ticker.innerText = 'Tick! (' + avg.toFixed(2) + 's)';

                    const fb = document.getElementById('pendelFeedback');
                    if (Math.abs(avg - 1.0) < 0.08) {
                        if (!pendelOk) {
                            pendelOk = true;
                            playTone(523, 300);
                            if (fb) { fb.innerHTML = '<strong style="color:lime;">PERFEKT! Exakt im Sekundentakt!</strong>'; }
                            setTimeout(() => {
                                const app = document.getElementById('app');
                                if (!document.getElementById('pendelWeiter')) {
                                    const btn = document.createElement('button');
                                    btn.id = 'pendelWeiter';
                                    btn.className = 'btn erfolg-animation';
                                    btn.innerText = 'Weiter – Zifferblatt bemalen';
                                    btn.onclick = () => { clearInterval(pendelInterval); next(); };
                                    app.appendChild(btn);
                                }
                            }, 500);
                        }
                    } else {
                        pendelOk = false;
                        const pw = document.getElementById('pendelWeiter');
                        if (pw) pw.remove();
                        if (avg < 0.92) {
                            if (fb) { fb.innerText = 'Zu schnell! Pendel verlängern.'; fb.style.color = '#ff6347'; }
                        } else if (avg > 1.08) {
                            if (fb) { fb.innerText = 'Zu langsam! Pendel kürzen.'; fb.style.color = '#ff6347'; }
                        } else {
                            if (fb) { fb.innerText = 'Fast... Feinjustierung!'; fb.style.color = 'orange'; }
                        }
                    }
                    playTone(800, 50);
                }
                lastTick = now;
            }

            draw();
        }

        slider.addEventListener('input', function() {
            length = parseInt(this.value);
            document.getElementById('pendelDisplay').innerText = 'Pendellänge: ' + length + ' cm';
            tickTimes = [];
            pendelOk = false;
        });

        draw();
        pendelInterval = setInterval(simulate, 16);
    }

    // --- Zifferblatt bemalen ---
    let paintColor = '#c0392b', paintStamp = 'rose';
    const STAMPS = { rose: '🌹', tulpe: '🌷', stern: '✿', blatt: '🍃' };
    const PAINT_COLORS = ['#c0392b','#e74c3c','#2980b9','#27ae60','#f39c12','#8e44ad','#e91e63','#00bcd4'];
    let paintedFlowers = [];

    function buildBemalenUI() {

    function drawClockFace() {
        const canvas = document.getElementById('faceCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height, cx = w/2, cy = h/2, r = w/2 - 5;

        ctx.clearRect(0, 0, w, h);

        // Hintergrund
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.fillStyle = '#f5e6c8'; ctx.fill();
        ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 3; ctx.stroke();

        // Innerer Ring
        ctx.beginPath(); ctx.arc(cx, cy, r*0.85, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(139,105,20,0.3)'; ctx.lineWidth = 1; ctx.stroke();

        // Römische Ziffern
        const roman = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
        ctx.fillStyle = '#333';
        ctx.font = 'bold 14px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (let i = 0; i < 12; i++) {
            const a = (i/12) * Math.PI * 2 - Math.PI/2;
            const tx = cx + Math.cos(a) * r * 0.72;
            const ty = cy + Math.sin(a) * r * 0.72;
            ctx.fillText(roman[i], tx, ty);
        }

        // Stundenstriche
        for (let i = 0; i < 60; i++) {
            const a = (i/60) * Math.PI * 2 - Math.PI/2;
            const len = i % 5 === 0 ? 0.88 : 0.92;
            ctx.strokeStyle = i % 5 === 0 ? '#333' : 'rgba(51,51,51,0.3)';
            ctx.lineWidth = i % 5 === 0 ? 2 : 1;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a)*r*len, cy + Math.sin(a)*r*len);
            ctx.lineTo(cx + Math.cos(a)*r*0.95, cy + Math.sin(a)*r*0.95);
            ctx.stroke();
        }

        // Gemalte Blumen
        ctx.font = '24px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        paintedFlowers.forEach(f => {
            ctx.fillStyle = f.color;
            ctx.font = '24px serif';
            ctx.fillText(STAMPS[f.stamp] || '🌹', f.x, f.y);
        });

        // Zeiger (dekorativ, zeigen ~10:10)
        // Stundenzeiger
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-Math.PI/6);
        ctx.fillStyle = '#333';
        ctx.fillRect(-2, -r*0.45, 4, r*0.45);
        ctx.restore();
        // Minutenzeiger
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(Math.PI/6);
        ctx.fillStyle = '#555';
        ctx.fillRect(-1.5, -r*0.6, 3, r*0.6);
        ctx.restore();
        // Zentrum
        ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2);
        ctx.fillStyle = '#333'; ctx.fill();
    }

    function initBemalen() {
        paintedFlowers = [];
        drawClockFace();

        const canvas = document.getElementById('faceCanvas');
        document.querySelectorAll('.color-swatch').forEach(s => {
            s.onclick = () => {
                document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
                s.classList.add('active');
                paintColor = s.dataset.color;
            };
        });
        document.querySelectorAll('.stamp-btn').forEach(s => {
            s.onclick = () => {
                document.querySelectorAll('.stamp-btn').forEach(x => x.classList.remove('active'));
                s.classList.add('active');
                paintStamp = s.dataset.stamp;
            };
        });

        const onTap = (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
            const cx = canvas.width/2, cy = canvas.height/2, r = canvas.width/2 - 10;
            // Nur innerhalb des Kreises
            if (Math.sqrt((x-cx)**2 + (y-cy)**2) > r*0.95) return;
            // Nicht zu nah an Mitte (Zeiger)
            if (Math.sqrt((x-cx)**2 + (y-cy)**2) < 25) return;

            paintedFlowers.push({ x, y, color: paintColor, stamp: paintStamp });
            playTone(400 + paintedFlowers.length * 50, 150);
            drawClockFace();

            document.getElementById('paintCount').innerText = 'Platzierte Blumen: ' + paintedFlowers.length + ' / 5';
            if (paintedFlowers.length >= 5) {
                const fb = document.getElementById('paintFeedback');
                if (fb) fb.innerHTML = '<strong style="color:lime;">Wunderschön! Meister Kuno wäre stolz.</strong>';
                setTimeout(() => {
                    const app = document.getElementById('app');
                    if (!document.getElementById('paintWeiter')) {

                        btn.id = 'paintWeiter';
                        btn.className = 'btn erfolg-animation';
                        btn.innerText = 'Weiter – Die Uhr erwacht';
                        btn.onclick = () => next();
                        app.appendChild(btn);
                    }
                }, 500);
            }
        };
        canvas.addEventListener('click', onTap);
        canvas.addEventListener('touchend', onTap, {passive:false});
    }

        const container = document.getElementById('roehreContainer');

        if (val > 180) {
            fb.innerText = "ACHTUNG! Die Röhre überhitzt – sofort runterdrehen!";
            fb.style.color = "#ff6347";
            if (container) container.innerHTML = roehreSVG(false);
            voltOk = false;
        } else if (val >= 108 && val <= 116) {
            fb.innerText = "PERFEKT! Die Röhre glüht stabil bei " + val + "V.";
            fb.style.color = "lime";
            if (container) container.innerHTML = roehreSVG(true);
            if (!voltOk) {
                voltOk = true;
                playTone(440, 300);
                const btn = document.getElementById('voltWeiter');
                if (btn) { btn.style.display = 'block'; btn.classList.add('erfolg-animation'); }
            }
        } else if (val > 60) {
            fb.innerText = "Die Filamente erwärmen sich... weiter.";
            fb.style.color = "white";
            if (container) container.innerHTML = roehreSVG(true);
            voltOk = false;
        } else if (val > 0) {
            fb.innerText = "Spannung steigt...";
            fb.style.color = "white";
            if (container) container.innerHTML = roehreSVG(false);
            voltOk = false;
        } else {
            fb.innerText = "Drehe langsam am Regler...";
            fb.style.color = "white";
            if (container) container.innerHTML = roehreSVG(false);
            voltOk = false;
        }

        if (weiterBtn && !voltOk) weiterBtn.style.display = 'none';
    }

    function buildMorseAlphabetHTML() {
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
        let cells = '';
        for (const ch of letters) {
            const code = MORSE[ch] || '';
            const pretty = code.split('').map(c => c === '.' ? '·' : '–').join('');
            cells += `<div class="morse-alpha-cell"><span class="char">${ch}</span><br><span class="code">${pretty}</span></div>`;
        }
        return `
            <button class="morse-alpha-toggle" onclick="document.getElementById('morseAlpha').classList.toggle('open'); this.innerText = this.innerText.includes('zeigen') ? 'Alphabet ausblenden' : 'Morse-Alphabet zeigen';">Morse-Alphabet zeigen</button>
            <div class="morse-alpha-table" id="morseAlpha">${cells}</div>`;
    }

    function buildMorseUI() {
        const s = morseState;
        const letter = s.letters[s.letterIdx];
        const morseCode = MORSE[letter] || '';

        let progress = '<div class="morse-progress">';
        for (let i = 0; i < s.letters.length; i++) {
            const cls = i < s.letterIdx ? 'done' : i === s.letterIdx ? 'active' : 'pending';
            progress += `<span class="${cls}">${s.letters[i]}</span>`;
        }
        progress += '</div>';

        return `
            <div class="game-area" id="morseGame">
                <div class="roehre-wrap" id="morseRoehre">${roehreSVG(true)}</div>
                ${progress}
                <div class="morse-target">${letter} = ${morseCode.split('').map(c => c === '.' ? '·' : '–').join(' ')}</div>
                <div class="morse-letter" id="morseCurrent"></div>
                <div class="morse-display" id="morseDisplay"></div>
                <button class="morse-btn" id="morseKey">MORSEN</button>
                <div class="morse-hint">Kurz = Punkt (·) &nbsp;|&nbsp; Lang = Strich (–)</div>
                <div id="morseFeedback" style="margin-top:10px; font-size:1.1em;"></div>
                ${buildMorseAlphabetHTML()}
            </div>`;
    }

    function initMorse() {
        const key = document.getElementById('morseKey');
        if (!key) return;

        let pressStart = 0;
        let dotDash = [];
        let letterTimeout = null;

        function onDown(e) {
            e.preventDefault();
            pressStart = Date.now();
            key.classList.add('pressed');
            const r = document.getElementById('morseRoehre');
            if (r) r.innerHTML = roehreSVG(true);
            playTone(680, 300);
            clearTimeout(letterTimeout);
        }

        function onUp(e) {
            e.preventDefault();
            if (!pressStart) return;
            const dur = Date.now() - pressStart;
            pressStart = 0;
            key.classList.remove('pressed');

            dotDash.push(dur < 250 ? '.' : '-');

            const display = document.getElementById('morseCurrent');
            if (display) display.innerText = dotDash.map(c => c === '.' ? '·' : '–').join(' ');

            clearTimeout(letterTimeout);
            letterTimeout = setTimeout(() => evaluateLetter(dotDash), 800);
        }

        key.addEventListener('mousedown', onDown);
        key.addEventListener('mouseup', onUp);
        key.addEventListener('mouseleave', onUp);
        key.addEventListener('touchstart', onDown, {passive: false});
        key.addEventListener('touchend', onUp, {passive: false});
    }

    function evaluateLetter(dotDash) {
        const s = morseState;
        const input = dotDash.join('');
        const expected = MORSE[s.letters[s.letterIdx]];
        const fb = document.getElementById('morseFeedback');

        if (input === expected) {
            if (fb) { fb.innerText = '✓ Richtig!'; fb.style.color = 'lime'; }
            const display = document.getElementById('morseDisplay');
            if (display) display.innerText = (display.innerText + s.letters[s.letterIdx]).trim();

            s.letterIdx++;
            if (s.letterIdx >= s.letters.length) {
                setTimeout(() => {
                    if (fb) { fb.innerHTML = '<strong>··· --- ··· GESENDET!</strong>'; fb.style.color = 'var(--gold)'; }
                    // Freitext-Modus anbieten
                    setTimeout(() => showFreeMorseOption(), 1000);
                }, 600);
            } else {
                setTimeout(() => {
                    document.getElementById('morseCurrent').innerText = '';
                    if (fb) fb.innerText = '';
                    const game = document.getElementById('morseGame');
                    if (game) {
                        game.outerHTML = buildMorseUI();
                        initMorse();
                        const d = document.getElementById('morseDisplay');
                        if (d) d.innerText = s.letters.slice(0, s.letterIdx).join('');
                    }
                }, 600);
            }
        } else {
            if (fb) {
                fb.innerText = '✗ Nochmal! ' + s.letters[s.letterIdx] + ' = ' + expected.split('').map(c => c === '.' ? '·' : '–').join(' ');
                fb.style.color = '#ff6347';
            }
        }
        dotDash.length = 0;
        const cur = document.getElementById('morseCurrent');
        if (cur) setTimeout(() => cur.innerText = '', 600);
    }

    function initFreeMorse() {
        const key = document.getElementById('morseKey');
        if (!key) return;

        let pressStart = 0;
        let dotDash = [];
        let letterTimeout = null;
        let fullText = '';

        function onDown(e) {
            e.preventDefault();
            pressStart = Date.now();
            key.classList.add('pressed');
            const r = document.getElementById('morseRoehre');
            if (r) r.innerHTML = roehreSVG(true);
            playTone(680, 300);
            clearTimeout(letterTimeout);
        }

        function onUp(e) {
            e.preventDefault();
            if (!pressStart) return;
            const dur = Date.now() - pressStart;
            pressStart = 0;
            key.classList.remove('pressed');

            dotDash.push(dur < 250 ? '.' : '-');

            const dots = document.getElementById('freeDots');
            if (dots) dots.innerText = dotDash.map(c => c === '.' ? '·' : '–').join(' ');

            clearTimeout(letterTimeout);
            letterTimeout = setTimeout(() => {
                const code = dotDash.join('');
                // Reverse-Lookup
                let found = '?';
                for (const [ch, m] of Object.entries(MORSE)) {
                    if (m === code) { found = ch; break; }
                }
                fullText += found;
                const output = document.getElementById('freeOutput');
                if (output) output.innerText = fullText;
                const decoded = document.getElementById('freeDecoded');
                if (decoded) decoded.innerText = code + ' → ' + found;
                const dots2 = document.getElementById('freeDots');
                if (dots2) dots2.innerText = '';
                dotDash.length = 0;
            }, 800);
        }

        key.addEventListener('mousedown', onDown);
        key.addEventListener('mouseup', onUp);
        key.addEventListener('mouseleave', onUp);
        key.addEventListener('touchstart', onDown, {passive: false});
        key.addEventListener('touchend', onUp, {passive: false});
    }

    // =============================================
    // SCHRITT 3: FREQUENZ SUCHEN
    // =============================================
    const TARGET_FREQ = 148; // kHz – Zielfrequenz
    let freqFound = false;
    let freqAngle = 0;

    function buildFrequenzUI() {
        return `
            <div class="game-area" id="freqGame">
                <div class="freq-display" id="freqDisplay">100.0 kHz</div>
                <div class="freq-bar-wrap">
                    <canvas id="freqCanvas" width="400" height="40"></canvas>
                </div>
                <div class="freq-dial-wrap">
                    <div class="freq-dial" id="freqDial">
                        <div class="freq-needle" id="freqNeedle"></div>
                    </div>
                </div>
                <p id="freqHint" style="color: rgba(253,245,230,0.5); font-size:0.9em;">Drehe den Knopf und suche das Signal...</p>
                <div class="freq-msg" id="freqMsg" style="display:none;"></div>
            </div>`;
    }

    function initFrequenz() {
        const dial = document.getElementById('freqDial');
        if (!dial) return;

        freqFound = false;
        freqAngle = 0;
        startNoise();

        let dragging = false;
        let lastAngle = 0;

        function getAngle(e, rect) {
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - cy, clientX - cx);
        }

        function onStart(e) {
            e.preventDefault();
            dragging = true;
            const rect = dial.getBoundingClientRect();
            lastAngle = getAngle(e, rect);
        }

        function onMove(e) {
            if (!dragging || freqFound) return;
            e.preventDefault();
            const rect = dial.getBoundingClientRect();
            const angle = getAngle(e, rect);
            let delta = angle - lastAngle;
            // Wrap-around
            if (delta > Math.PI) delta -= 2 * Math.PI;
            if (delta < -Math.PI) delta += 2 * Math.PI;
            lastAngle = angle;
            freqAngle += delta;

            // Frequenz berechnen (100–200 kHz über mehrere Umdrehungen)
            const freq = 100 + ((freqAngle / (Math.PI * 6)) * 100);
            const clampedFreq = Math.max(100, Math.min(200, freq));
            updateFrequenz(clampedFreq);
        }

        function onEnd() { dragging = false; }

        dial.addEventListener('mousedown', onStart);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        dial.addEventListener('touchstart', onStart, {passive: false});
        document.addEventListener('touchmove', onMove, {passive: false});
        document.addEventListener('touchend', onEnd);

        // Initial draw
        drawSignalBar(100);
    }

    function updateFrequenz(freq) {
        const display = document.getElementById('freqDisplay');
        const needle = document.getElementById('freqNeedle');
        const hint = document.getElementById('freqHint');

        if (display) display.innerText = freq.toFixed(1) + ' kHz';
        if (needle) needle.style.transform = `rotate(${freqAngle * (180/Math.PI)}deg)`;

        drawSignalBar(freq);

        // Nähe zur Zielfrequenz
        const distance = Math.abs(freq - TARGET_FREQ);

        // Rauschen anpassen
        if (distance < 2) {
            setNoiseLevel(0.01);
        } else if (distance < 8) {
            setNoiseLevel(0.03);
        } else if (distance < 20) {
            setNoiseLevel(0.06);
        } else {
            setNoiseLevel(0.08);
        }

        if (distance < 8 && !freqFound) {
            if (hint) { hint.innerText = 'Ein Signal! Feinjustierung...'; hint.style.color = 'lime'; }
        } else if (!freqFound) {
            if (hint) { hint.innerText = 'Nur Rauschen... weitersuchen.'; hint.style.color = 'rgba(253,245,230,0.5)'; }
        }

        // Getroffen!
        if (distance < 3 && !freqFound) {
            freqFound = true;
            stopNoise();
            if (hint) { hint.innerHTML = '<strong style="color:lime;">SIGNAL GEFUNDEN!</strong>'; }

            const msg = document.getElementById('freqMsg');
            if (msg) {
                msg.style.display = 'block';
                // Antwort Buchstabe für Buchstabe tippen
                const antwort = "EMPFANGEN. ALLES KLAR. ENDE.";
                // Morse-Sound abspielen
                playMorseString('.- .-.. .-.. . ... -.- .-.. .- .-.', () => {});
                let i = 0;
                msg.innerHTML = '<span style="color:var(--gold);">Linz antwortet:</span><br>';
                const typeInterval = setInterval(() => {
                    if (i < antwort.length) {
                        msg.innerHTML += antwort[i];
                        i++;
                    } else {
                        clearInterval(typeInterval);
                        setTimeout(() => {
                            const app = document.getElementById('app');
                            const weiterBtn = document.createElement('button');
                            weiterBtn.className = 'btn erfolg-animation';
                            weiterBtn.innerText = 'Mission abschließen';
                            weiterBtn.onclick = () => next();
                            app.appendChild(weiterBtn);
                        }, 800);
                    }
                }, 70);
            }
        }
    }

    function drawSignalBar(freq) {
        const canvas = document.getElementById('freqCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        // Rauschen zeichnen
        ctx.strokeStyle = 'rgba(0,255,0,0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < w; x++) {
            const noise = Math.random() * h * 0.6;
            // Signal-Peak bei Zielfrequenz
            const barFreq = 100 + (x / w) * 100;
            const dist = Math.abs(barFreq - TARGET_FREQ);
            const signal = dist < 5 ? Math.max(0, (5 - dist) / 5) * h * 0.8 : 0;
            const y = h / 2 - noise * 0.3 + Math.sin(x * 0.3) * 3 - signal * 0.5;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Signal-Bereich hervorheben
        const signalX = ((TARGET_FREQ - 100) / 100) * w;
        ctx.fillStyle = 'rgba(0,255,0,0.08)';
        ctx.fillRect(signalX - 10, 0, 20, h);

        // Aktuelle Position
        const posX = ((freq - 100) / 100) * w;
        ctx.strokeStyle = 'var(--gold)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(posX, 0);
        ctx.lineTo(posX, h);
        ctx.stroke();
    }

    // =============================================
    // SCHRITT 4: ERFOLG + FUN FACTS
    // =============================================
    function buildErfolgUI() {
        const elapsed = startTime ? Math.round((Date.now() - startTime) / 1000) : 0;
        const min = Math.floor(elapsed / 60);
        const sec = elapsed % 60;
        const zeitStr = min > 0 ? `${min}m ${sec}s` : `${sec}s`;

        return `
            <div class="fade-in">
                <div class="erfolg-icon">📡</div>
                <h1 style="font-size:1.2em;">Mission erfüllt!</h1>
                <p>Du hast die erste drahtlose Nachricht von Wien nach Linz gesendet – mit der Siemens GRS 1 Verstärkerröhre.</p>

                <div class="erfolg-stats">
                    <div class="erfolg-stat">
                        <div class="label">Deine Zeit</div>
                        <div class="value">${zeitStr}</div>
                    </div>
                    <div class="erfolg-stat">
                        <div class="label">Nachricht</div>
                        <div class="value">SOS</div>
                    </div>
                    <div class="erfolg-stat">
                        <div class="label">Spannung</div>
                        <div class="value">112 V</div>
                    </div>
                    <div class="erfolg-stat">
                        <div class="label">Frequenz</div>
                        <div class="value">${TARGET_FREQ} kHz</div>
                    </div>
                </div>

                <div class="fun-facts">
                    <h3>Wusstest du?</h3>
                    <ul>
                        <li>Die GRS 1 war eine der ersten <strong>Verstärkerröhren</strong> in Österreich – sie machte schwache Funksignale stark genug zum Empfang.</li>
                        <li><strong>SOS</strong> wurde 1906 als internationales Notsignal eingeführt – nicht weil es für etwas steht, sondern weil ··· --- ··· einfach zu morsen ist.</li>
                        <li>Vor der Röhre mussten Funker mit <strong>Kristalldetektoren</strong> arbeiten – die waren so leise, dass man in absoluter Stille sitzen musste.</li>
                        <li>Eine einzige GRS 1 verbrauchte mehr Strom als ein heutiges Smartphone in einer Woche – für ein einziges, schwaches Signal.</li>
                    </ul>
                </div>

                <button class="btn" onclick="aktuellerSchritt=0; startTime=null; render();">Nochmal spielen</button>
                <button class="btn" style="background:transparent; border:2px solid var(--gold); color:var(--gold);" onclick="window.location.search=''">Zur Übersicht</button>
            </div>`;
    }

    // =============================================
    // START
    // =============================================
    render();
</script>
