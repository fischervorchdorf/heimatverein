<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum meets KI – Digitale Ausstellung</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #020b14;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #brain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(2, 11, 20, 0.45) 0%, rgba(2, 11, 20, 0.8) 100%);
        }

        .content-wrapper {
            text-align: center;
            pointer-events: auto;
            padding: 2rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(2, 11, 20, 0.9);
        }

        .subtitle-top {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(0, 229, 255, 0.9);
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.8s forwards;
            background: linear-gradient(135deg, #ffffff 0%, #00e5ff 50%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1s ease 0.8s forwards, shimmer 4s ease-in-out infinite 2s;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.9rem, 2.5vw, 1.3rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.8rem;
            opacity: 0;
            animation: fadeInUp 1s ease 1.1s forwards;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .exhibition-info {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 400;
            color: rgba(212, 175, 55, 1);
            letter-spacing: 2px;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease 1.3s forwards;
        }

        .cta-button {
            display: inline-block;
            padding: 1rem 3rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
            border: 2px solid #00e5ff;
            border-radius: 50px;
            background: rgba(0, 229, 255, 0.1);
            transition: all 0.4s ease;
            opacity: 0;
            animation: fadeInUp 1s ease 1.6s forwards;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .cta-button:hover {
            background: rgba(0, 229, 255, 0.25);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3), inset 0 0 30px rgba(0, 229, 255, 0.1);
            transform: translateY(-2px);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* Back link */
        .back-link {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 10;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link:hover {
            color: #00e5ff;
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Scan lines overlay effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 229, 255, 0.015) 2px,
                rgba(0, 229, 255, 0.015) 4px
            );
        }

        /* Bottom info bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 5;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeIn 1s ease 2.5s forwards;
        }

        .bottom-bar a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            transition: color 0.3s;
        }

        .bottom-bar a:hover {
            color: #00e5ff;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        /* Loading screen */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: #020b14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loading.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-ring {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(0, 229, 255, 0.1);
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: rgba(0, 229, 255, 0.6);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .bottom-bar {
                flex-direction: column;
                gap: 0.3rem;
                text-align: center;
                padding: 0.8rem 1rem;
            }

            .cta-button {
                padding: 0.8rem 2rem;
                font-size: 0.85rem;
            }

            .back-link {
                top: 1rem;
                left: 1rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loading">
        <div class="loading-ring"></div>
        <div class="loading-text">Initialisiere...</div>
    </div>

    <!-- Back to main site -->
    <a href="../sonderausstellungen.html" class="back-link">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Heimatverein Vorchdorf
    </a>

    <!-- 3D Canvas -->
    <canvas id="brain-canvas"></canvas>

    <!-- Content Overlay -->
    <div class="overlay">
        <div class="content-wrapper">
            <div class="subtitle-top">Museum der Region Vorchdorf</div>
            <h1 class="main-title">MUSEUM MEETS KI</h1>
            <p class="subtitle">Eine interaktive Reise durch künstliche Intelligenz</p>
            <p class="exhibition-info">25. März – Juni 2026</p>
            <a href="experience.html" class="cta-button">Reise starten</a>
        </div>
    </div>

    <!-- Scan lines effect -->
    <div class="scanlines"></div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
        <span>Heimat- und Kulturverein Vorchdorf</span>
        <a href="../index.html">heimatvereinvorchdorf.at</a>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/brain.js"></script>
    <script>
        // Hide loading screen after Three.js initializes
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading').classList.add('hidden');
            }, 800);
        });
    </script>
</body>
</html>
