<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI weltweit – Museum meets KI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #020b14;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
            padding: 1rem 1.5rem;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(2, 11, 20, 0.95);
            border-bottom: 1px solid rgba(0, 229, 255, 0.1);
        }

        .back-link {
            color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.85rem;
            display: flex; align-items: center; gap: 0.5rem; transition: color 0.3s;
        }
        .back-link:hover { color: #00e5ff; }
        .back-link svg { width: 16px; height: 16px; fill: currentColor; }

        .page-title {
            font-family: 'Orbitron', sans-serif; font-size: 0.8rem;
            font-weight: 700; color: #00e5ff; letter-spacing: 2px;
        }

        .main {
            padding: 5rem 1rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem; font-weight: 700;
            text-align: center; margin-bottom: 0.3rem;
        }

        .section-desc {
            text-align: center; color: rgba(255,255,255,0.5);
            font-size: 0.85rem; margin-bottom: 1.5rem;
        }

        /* Map container */
        .map-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 1rem;
        }

        .world-map {
            width: 100%;
            height: auto;
        }

        .map-region {
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.5;
        }

        .map-region:hover {
            opacity: 0.8;
        }

        .map-region.active {
            opacity: 1;
        }

        /* Region buttons (mobile-friendly alternative) */
        .region-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .region-btn {
            padding: 0.7rem 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: rgba(14, 34, 51, 0.6);
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .region-btn:hover {
            border-color: rgba(255,255,255,0.3);
            color: #ffffff;
        }

        .region-btn.active {
            color: #ffffff;
        }

        .region-btn[data-region="eu"].active {
            border-color: #00e5ff;
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .region-btn[data-region="usa"].active {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .region-btn[data-region="china"].active {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.2);
        }

        .region-flag { font-size: 1.2rem; }

        /* Info panel */
        #info-panel {
            background: rgba(14, 34, 51, 0.8);
            border: 1px solid rgba(0, 229, 255, 0.15);
            border-radius: 16px;
            padding: 1.5rem;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.4s ease;
        }

        #info-panel.visible {
            max-height: 800px;
            opacity: 1;
            margin-bottom: 2rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .panel-header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        #panel-flag { font-size: 2rem; }

        #panel-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
        }

        #panel-approach {
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.2rem;
        }

        #close-panel {
            width: 32px; height: 32px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        #close-panel:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        /* Laws list */
        .law-item {
            padding: 1rem;
            background: rgba(2, 11, 20, 0.5);
            border-radius: 10px;
            margin-bottom: 0.8rem;
            border-left: 3px solid rgba(0, 229, 255, 0.3);
        }

        .law-item h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #00e5ff;
            margin-bottom: 0.4rem;
        }

        .law-item p {
            font-size: 0.83rem;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
        }

        #panel-summary {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.6;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-style: italic;
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .page-transition {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #020b14; z-index: 1000; opacity: 0;
            pointer-events: none; transition: opacity 0.4s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .page-transition.active { opacity: 1; pointer-events: auto; }
        .transition-ring {
            width: 40px; height: 40px; border: 2px solid rgba(0,229,255,0.1);
            border-top-color: #00e5ff; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .touch-ripple {
            position: absolute; width: 60px; height: 60px; border-radius: 50%;
            background: rgba(0,229,255,0.2); transform: translate(-50%,-50%) scale(0);
            animation: ripple 0.6s ease-out forwards; pointer-events: none;
        }
        @keyframes ripple { to { transform: translate(-50%,-50%) scale(1); opacity: 0; } }

        @media (max-width: 768px) {
            .header { padding: 0.8rem 1rem; }
            .page-title { font-size: 0.7rem; }
            .section-title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="experience.html" class="back-link">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Zurück
        </a>
        <span class="page-title">KI WELTWEIT</span>
    </div>

    <div class="main">
        <h1 class="section-title">KI-Regulierung weltweit</h1>
        <p class="section-desc">Wie unterschiedlich Regionen KI regulieren</p>

        <!-- World Map SVG -->
        <div class="map-container">
            <svg class="world-map" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
                <!-- Background -->
                <rect width="800" height="400" fill="transparent"/>

                <!-- Grid lines -->
                <line x1="0" y1="200" x2="800" y2="200" stroke="rgba(0,229,255,0.05)" stroke-width="0.5"/>
                <line x1="400" y1="0" x2="400" y2="400" stroke="rgba(0,229,255,0.05)" stroke-width="0.5"/>

                <!-- USA (North America) -->
                <g class="map-region" data-region="usa">
                    <path d="M 80,100 L 120,85 L 180,80 L 230,90 L 260,95 L 280,110 L 270,130 L 280,140 L 260,160 L 240,175 L 200,180 L 160,170 L 120,165 L 90,155 L 70,140 L 75,120 Z"
                          fill="#d4af37" stroke="rgba(212,175,55,0.5)" stroke-width="1"/>
                    <!-- Alaska -->
                    <path d="M 50,70 L 80,65 L 90,75 L 75,85 L 55,82 Z"
                          fill="#d4af37" stroke="rgba(212,175,55,0.5)" stroke-width="1"/>
                    <text x="175" y="135" text-anchor="middle" fill="white" font-family="Orbitron" font-size="12" font-weight="700">USA</text>
                </g>

                <!-- EU (Europe) -->
                <g class="map-region" data-region="eu">
                    <path d="M 380,70 L 420,60 L 460,65 L 490,75 L 500,90 L 510,105 L 500,120 L 490,135 L 470,145 L 450,150 L 430,155 L 410,150 L 390,140 L 380,125 L 375,110 L 370,90 Z"
                          fill="#00e5ff" stroke="rgba(0,229,255,0.5)" stroke-width="1"/>
                    <!-- Scandinavia -->
                    <path d="M 420,40 L 440,35 L 460,45 L 455,60 L 435,65 L 420,55 Z"
                          fill="#00e5ff" stroke="rgba(0,229,255,0.5)" stroke-width="1"/>
                    <!-- UK & Ireland -->
                    <path d="M 365,75 L 378,68 L 382,80 L 375,90 L 365,85 Z"
                          fill="#00e5ff" stroke="rgba(0,229,255,0.5)" stroke-width="1"/>
                    <!-- Spain/Portugal -->
                    <path d="M 370,140 L 390,135 L 400,145 L 395,160 L 375,158 L 368,150 Z"
                          fill="#00e5ff" stroke="rgba(0,229,255,0.5)" stroke-width="1"/>
                    <!-- Italy -->
                    <path d="M 440,145 L 450,140 L 460,155 L 455,175 L 445,170 L 440,155 Z"
                          fill="#00e5ff" stroke="rgba(0,229,255,0.5)" stroke-width="1"/>
                    <text x="440" y="110" text-anchor="middle" fill="white" font-family="Orbitron" font-size="12" font-weight="700">EU</text>
                </g>

                <!-- China -->
                <g class="map-region" data-region="china">
                    <path d="M 580,100 L 620,90 L 670,95 L 710,105 L 720,120 L 715,140 L 700,155 L 680,165 L 650,170 L 620,165 L 600,155 L 585,140 L 575,120 Z"
                          fill="#ff6b6b" stroke="rgba(255,107,107,0.5)" stroke-width="1"/>
                    <!-- Mongolia region -->
                    <path d="M 610,80 L 650,75 L 680,85 L 670,95 L 630,92 L 610,88 Z"
                          fill="#ff6b6b" stroke="rgba(255,107,107,0.5)" stroke-width="1"/>
                    <text x="650" y="135" text-anchor="middle" fill="white" font-family="Orbitron" font-size="12" font-weight="700">CHINA</text>
                </g>

                <!-- Other continents (dimmed) -->
                <!-- South America -->
                <path d="M 190,210 L 220,200 L 250,220 L 260,260 L 250,300 L 230,330 L 210,340 L 195,320 L 185,280 L 180,240 Z"
                      fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
                <!-- Africa -->
                <path d="M 410,180 L 450,175 L 480,200 L 490,240 L 480,280 L 460,310 L 440,320 L 420,310 L 405,280 L 400,240 L 405,200 Z"
                      fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
                <!-- Australia -->
                <path d="M 640,270 L 680,260 L 720,270 L 730,290 L 720,310 L 690,320 L 660,315 L 640,300 L 635,285 Z"
                      fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
                <!-- India/South Asia -->
                <path d="M 560,160 L 590,155 L 610,170 L 600,200 L 580,210 L 560,200 L 555,180 Z"
                      fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
                <!-- Russia (not EU) -->
                <path d="M 500,40 L 550,30 L 620,35 L 700,45 L 750,55 L 760,70 L 740,80 L 700,75 L 620,70 L 550,65 L 510,60 L 500,50 Z"
                      fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
                <!-- Japan -->
                <path d="M 725,100 L 735,95 L 740,105 L 738,120 L 730,125 L 725,115 Z"
                      fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
            </svg>
        </div>

        <!-- Region buttons -->
        <div class="region-buttons">
            <button class="region-btn" data-region="eu">
                <span class="region-flag">🇪🇺</span> EU
            </button>
            <button class="region-btn" data-region="usa">
                <span class="region-flag">🇺🇸</span> USA
            </button>
            <button class="region-btn" data-region="china">
                <span class="region-flag">🇨🇳</span> China
            </button>
        </div>

        <!-- Info panel -->
        <div id="info-panel">
            <div class="panel-header">
                <div class="panel-header-left">
                    <span id="panel-flag">🇪🇺</span>
                    <div>
                        <div id="panel-name">Europäische Union</div>
                        <div id="panel-approach">Regulierung & Bürgerrechte</div>
                    </div>
                </div>
                <button id="close-panel">&times;</button>
            </div>

            <div id="panel-laws"></div>
            <p id="panel-summary"></p>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background: #00e5ff;"></div>
                <span>Strenge Regulierung</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #d4af37;"></div>
                <span>Marktgetrieben</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #ff6b6b;"></div>
                <span>Staatliche Kontrolle</span>
            </div>
        </div>
    </div>

    <script src="js/worldmap.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
